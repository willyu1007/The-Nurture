version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.
  SERVICE_NAME:
    type: string
    required: true
    default: the-nurture
    description: Nurture owner service name used by logs and deployment metadata.
  PORT:
    type: int
    required: true
    default: 8000
    description: Formal NestJS scenario-service listen port; local ecosystem routing maps the Base-assigned backend endpoint separately.
  DATABASE_URL:
    type: url
    required: true
    secret: true
    secret_ref: database_url
    description: PostgreSQL connection URL for Nurture-owned production schema and migrations.
  NURTURE_BINDING_EVIDENCE_KEY:
    type: string
    required: false
    secret: true
    secret_ref: nurture_binding_evidence_key
    description: HMAC key (at least 32 characters) enabling the scenario-binding owner endpoint; absence keeps the endpoint disabled and never degrades to an unhashed path.
  NURTURE_INTERNAL_SERVICE_TOKEN:
    type: string
    required: false
    secret: true
    secret_ref: nurture_internal_service_token
    description: Private My-Chat-to-Nurture service-auth token for owner endpoints; never persisted or logged.
  NURTURE_HARNESS_INTEGRITY_KEY:
    type: string
    required: false
    secret: true
    secret_ref: nurture_harness_integrity_key
    description: HMAC key (at least 32 characters) for Harness confirmation input-integrity tags and owner-issued target refs; absence keeps both Harness routes disabled.
  NURTURE_PROTECTED_CONTENT_KEY:
    type: string
    required: false
    secret: true
    secret_ref: nurture_protected_content_key
    description: AES-256-GCM key material (at least 32 characters) sealing protected family-care bodies at rest; absence keeps both Harness routes disabled and never degrades to plaintext.
  NURTURE_INSTITUTION_BUSINESS_COMMUNICATION_READ_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off provider gate for the protected Institution Admin business-communication owner-read; true only after exact interface pin and consumer adoption.
  NURTURE_TEACHER_RELEASE_OWNER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the versioned teacher release owner composition; true requires the exact My-Chat consumer pin and separately authorized activation.
  NURTURE_PARENT_CONTEXT_PRESENTER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the parent-context presenter v1 owner composition; true requires the exact adopted contract digest and separately authorized owner-port activation.
  NURTURE_PARENT_COMMUNICATION_OWNER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the parent-communication owner v1 composition; true requires the exact adopted contract digest, complete authority/owner/async ports and separately authorized activation.
  NURTURE_DIRECTOR_PRESENTER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the read-only director presenter v1 composition; true requires the exact adopted contract digest, current-authority/owner ports and separate activation approval, and never enables Institution Mobile commands.
  NURTURE_TEACHER_CLASS_STREAM_PRESENTER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the read-only teacher class-stream presenter v1 composition; true requires the exact adopted contract digest, complete caregiver authority/owner ports and separate activation approval, and admits no class-stream write path.
  NURTURE_TEACHER_ORGANIZATION_OWNER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the teacher organization-owner v1 exchange composition; true requires the exact adopted contract digest, complete caregiver authority/owner/protected-content ports and separate activation approval, and never authorizes release or auto-send.
  NURTURE_TEACHER_COMMUNICATION_OWNER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the teacher communication-owner v1 exchange composition; true requires the exact adopted contract digest, complete caregiver authority/owner/protected-content ports and separate activation approval; class-group send stays reserved and nothing schedules or auto-sends.
  NURTURE_TEACHER_MEDIA_ASSOCIATION_OWNER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the teacher media-association owner v1 exchange composition (association-only); true requires the exact adopted contract digest, complete caregiver authority/owner ports and separate activation approval; no bytes, thumbnails or previews exist until the reserved media ingress ships.
  NURTURE_TEACHER_ASSISTANT_QUERY_OWNER_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the teacher assistant-query owner v1 exchange composition (missing-records, weekly-source, weekly-draft); true requires the exact adopted contract digest, complete caregiver authority/owner ports and separate activation approval; the owner assembles deterministic facts only and never calls a model provider.
  NURTURE_PARENT_COMMUNICATION_EXTENSION_ENABLED:
    type: bool
    required: false
    default: false
    description: Default-off gate for the parent-communication owner v1.1 additive extension (guardian redaction preview/commit and the per-message delivery-receipt read); independent of the frozen v1 gate so the 1.0.0 posture is untouched; true requires the exact adopted extension digest, complete guardian authority/owner ports and separate activation approval.
  FAMILY_GROWTH_EVENTS_SERVICE_TOKEN:
    type: string
    required: false
    secret: true
    secret_ref: family_growth_events_service_token
    description: Nurture-to-My-Chat bearer for family-growth event delivery (family_growth_transport@1.0.0); absent = delivery worker off.
  FAMILY_GROWTH_RENDITION_SERVICE_TOKEN:
    type: string
    required: false
    secret: true
    secret_ref: family_growth_rendition_service_token
    description: My-Chat-to-Nurture bearer validated by the rendition exchange (family_growth_transport@1.0.0); absent = endpoints refuse all requests.
  FAMILY_GROWTH_RENDITION_SERVICE_TOKEN_PREVIOUS:
    type: string
    required: false
    secret: true
    secret_ref: family_growth_rendition_service_token_previous
    description: Rotation window twin of FAMILY_GROWTH_RENDITION_SERVICE_TOKEN; cleared after rotation completes.
  MY_CHAT_INTERNAL_BASE_URL:
    type: url
    required: false
    description: My-Chat host base URL for host-ward internal reads (ST-5 derived age/stage); the shared internal service token authenticates the call. Absence keeps derived reads disabled.
