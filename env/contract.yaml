version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.
  SERVICE_NAME:
    type: string
    required: true
    default: the-nurture
    description: Nurture owner service name used by logs and deployment metadata.
  PORT:
    type: int
    required: true
    default: 8000
    description: Formal NestJS scenario-service listen port; local ecosystem routing maps the Base-assigned backend endpoint separately.
  DEV_HOST_PORT:
    type: int
    required: false
    default: 3001
    scopes: [dev]
    description: Loopback-only Fastify workflow dev-host listen port; never used by the formal scenario service.
  NURTURE_BACKEND_URL:
    type: url
    required: false
    default: http://localhost:3200
    scopes: [dev]
    description: Local Base-assigned Nurture backend endpoint consumed by the frontend workbench; topology only, not an API-contract field.
  DATABASE_URL:
    type: url
    required: true
    secret: true
    secret_ref: database_url
    description: PostgreSQL connection URL for Nurture-owned production schema and migrations.
  DEV_HOST_DATABASE_URL:
    type: url
    required: true
    scopes: [dev]
    secret: true
    secret_ref: dev_host_database_url
    description: PostgreSQL connection URL for backend-private workflow dev-host schema and migrations.
  NURTURE_BINDING_EVIDENCE_KEY:
    type: string
    required: false
    secret: true
    secret_ref: nurture_binding_evidence_key
    description: HMAC key (at least 32 characters) enabling the scenario-binding owner endpoint; absence keeps the endpoint disabled and never degrades to an unhashed path.
  NURTURE_INTERNAL_SERVICE_TOKEN:
    type: string
    required: false
    secret: true
    secret_ref: nurture_internal_service_token
    description: Private My-Chat-to-Nurture service-auth token for owner endpoints; never persisted or logged.
  NURTURE_HARNESS_INTEGRITY_KEY:
    type: string
    required: false
    secret: true
    secret_ref: nurture_harness_integrity_key
    description: HMAC key (at least 32 characters) for Harness confirmation input-integrity tags and owner-issued target refs; absence keeps both Harness routes disabled.
  NURTURE_PROTECTED_CONTENT_KEY:
    type: string
    required: false
    secret: true
    secret_ref: nurture_protected_content_key
    description: AES-256-GCM key material (at least 32 characters) sealing protected family-care bodies at rest; absence keeps both Harness routes disabled and never degrades to plaintext.
  MY_CHAT_INTERNAL_BASE_URL:
    type: url
    required: false
    description: My-Chat host base URL for host-ward internal reads (ST-5 derived age/stage); the shared internal service token authenticates the call. Absence keeps derived reads disabled.
