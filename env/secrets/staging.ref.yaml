version: 1
secrets:
  database_url:
    backend: env
    ref: env://DATABASE_URL
    hint: Inject the staging Nurture database URL through the deployment environment.
  nurture_internal_service_token:
    backend: env
    ref: env://NURTURE_INTERNAL_SERVICE_TOKEN
    hint: Inject the approved staging My-Chat-to-Nurture service token.
  nurture_harness_integrity_key:
    backend: env
    ref: env://NURTURE_HARNESS_INTEGRITY_KEY
    hint: Inject the staging owner-resolution HMAC key required by the W6 Prisma binding.
