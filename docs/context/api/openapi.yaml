openapi: 3.1.0
info:
  title: The Nurture Scenario Service API
  version: 1.0.0
  description: |
    Canonical contract for the formal NestJS ingress owned by The Nurture.
    My-Chat remains the authenticated consumer and owns product-shell routing.
    Host, port and base URL are environment topology and are not part of the
    wire contract.
  x-source-mapping:
    controllers: apps/scenario-service/src
    transportSchemas: packages/nurture-scenario/src/adapters/binding-owner-http.ts
servers: []
paths:
  /health:
    get:
      operationId: getScenarioServiceHealth
      summary: Check scenario-service liveness
      tags: [service]
      security: []
      responses:
        '200':
          description: The process is accepting HTTP requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /internal/nurture/scenario-binding/authorize:
    post:
      operationId: authorizeScenarioBindingOwner
      summary: Authorize one current scenario-binding owner operation
      description: |
        Private My-Chat-to-Nurture owner call. The service credential proves
        caller possession only; the owner authorizer separately rereads current
        Nurture authority. Missing owner composition or either required secret
        keeps the endpoint disabled.
      tags: [binding-owner]
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioBindingAuthorizeRequest'
      responses:
        '200':
          description: Current owner authority was verified and a short-lived receipt was issued or exactly replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioBindingAuthorizeResponse'
        '400':
          description: The JSON shell or binding request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '401':
          description: The service bearer is missing or invalid while the owner composition is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '403':
          description: Current Nurture authority denied the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '408':
          description: The bounded request handler timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '409':
          description: The anchor or exact-replay state is not current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '413':
          description: The JSON body exceeds the 64 KiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '415':
          description: The request body encoding or media type is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '500':
          description: The owner adapter failed without exposing internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
        '503':
          description: The owner path is disabled or current authorization is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingOwnerError'
  /internal/nurture/harness/prepare-action:
    post:
      operationId: prepareHarnessAction
      summary: Prepare one family-care Harness action for confirmation
      description: |
        Private My-Chat-to-Nurture Harness call. Resolves current eligibility
        and targets for one closed family-care capability and returns
        ready_to_confirm with a five-minute single-consume confirmation, or
        needs_input, denied or unavailable. No business fact is created;
        missing Harness key material keeps both routes disabled.
      tags: [harness]
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarnessPrepareRequest'
      responses:
        '200':
          description: The closed prepare decision for the requested capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessPrepareResponse'
        '400':
          description: The request shell is invalid or the capability key is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '401':
          description: The service bearer is missing or invalid while the Harness is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '408':
          description: The bounded request handler timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '503':
          description: The Harness path is disabled by missing key material or service auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
  /internal/nurture/harness/execute-action:
    post:
      operationId: executeHarnessAction
      summary: Execute one confirmed family-care Harness action
      description: |
        Private My-Chat-to-Nurture Harness call. Verifies and consumes the
        confirmation inside the same Nurture transaction as the business
        effect, re-reads current authority and returns committed with the
        exact replay-stable result, or not_committed with a machine-readable
        recovery. Committed replays of the same command return the original
        result without a second effect.
      tags: [harness]
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarnessExecuteRequest'
      responses:
        '200':
          description: The execute outcome for the confirmed action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessExecuteResponse'
        '400':
          description: The request shell is invalid or the capability key is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '401':
          description: The service bearer is missing or invalid while the Harness is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '408':
          description: The bounded request handler timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '503':
          description: The Harness path is disabled by missing key material or service auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
  /internal/nurture/harness/query:
    post:
      operationId: queryHarnessCapability
      summary: Read one role-safe family-care query projection
      description: |
        Private My-Chat-to-Nurture Harness read. Resolves the caller's current
        role reach and returns the requested closed query projection (guardian
        timeline, caregiver work list, or role-specific item detail) with
        owner-issued opaque refs and keyed snapshot cursors. Queries never
        write and never create a CommandExecution.
      tags: [harness]
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarnessQueryRequest'
      responses:
        '200':
          description: The closed query decision for the requested capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessQueryResponse'
        '400':
          description: The request shell is invalid or the capability key is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '401':
          description: The service bearer is missing or invalid while the Harness is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '408':
          description: The bounded request handler timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '503':
          description: The Harness path is disabled by missing key material or service auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
  /internal/nurture/harness/read-result:
    post:
      operationId: readHarnessResult
      summary: Re-read the role-safe projection for a committed action
      description: |
        Private My-Chat-to-Nurture Harness read. Looks up the committed
        execution by its stable business command identity, verifies the
        caller owns it, and regenerates the role-safe item projection from
        that execution's own stored output refs plus current owner state.
        Historical business results are never rehydrated from the caller and
        current mutable state never enters the immutable committed result.
      tags: [harness]
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarnessReadResultRequest'
      responses:
        '200':
          description: The closed read-result decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessQueryResponse'
        '400':
          description: The request shell is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '401':
          description: The service bearer is missing or invalid while the Harness is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '408':
          description: The bounded request handler timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '503':
          description: The Harness path is disabled by missing key material or service auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
  /internal/nurture/institution/business-communications:read:
    post:
      operationId: readInstitutionBusinessCommunication
      summary: Read one disclosed Institution business communication
      description: |
        Protected, noncanonical, request-composed Nurture owner-read for a
        current exact Institution Admin. The service rereads the exact
        Institution, Enrollment, CareGroup, original Grant, disclosure and
        message lifecycle. The response is no-store and grants no action
        authority. This provider route is default-off until consumer adoption
        pins the exact interface key, version and digest.
      tags: [institution-owner-read]
      security:
        - serviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionBusinessCommunicationReadRequest'
      responses:
        '200':
          description: Current exact owner-read decision.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionBusinessCommunicationReadResponse'
        '400':
          description: The request shell or exact interface pin is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '401':
          description: The private service bearer is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '408':
          description: The bounded request handler timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
        '503':
          description: The provider interface or Harness composition is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessError'
components:
  securitySchemes:
    serviceBearerAuth:
      type: http
      scheme: bearer
      description: Private service credential; never an adult or business-authority grant.
  schemas:
    BoundedIdentifier:
      type: string
      minLength: 1
      maxLength: 512
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    ScenarioBindingAuthorizeRequest:
      type: object
      description: |
        Frozen P7 request. Unknown top-level fields remain ignored for current
        wire compatibility; they do not become trusted inputs.
      additionalProperties: true
      required:
        - workspace_id
        - acting_user_id
        - idempotency_key
        - subject_type
        - subject_id
        - scenario_key
        - acting_actor_id
        - purpose
      properties:
        workspace_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        acting_user_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        idempotency_key:
          $ref: '#/components/schemas/BoundedIdentifier'
        subject_type:
          type: string
          enum: [child, family]
        subject_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        scenario_key:
          type: string
          const: nurture
        acting_actor_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        represented_organization_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        purpose:
          type: string
          const: scenario_binding_write
        correlation_id:
          type: string
        trace_id:
          type: string
    ScenarioBindingAuthorizeResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - authorization_ref
        - workspace_id
        - subject_type
        - subject_id
        - scenario_key
        - owner_ref
        - owner_version
        - authorized_actor_id
        - purpose
        - verified_at
        - expires_at
      properties:
        status:
          type: string
          const: authorized
        authorization_ref:
          type: string
          pattern: '^nurture_scenario_binding_authorization_v1:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        workspace_id:
          type: string
          minLength: 1
        subject_type:
          type: string
          enum: [child, family]
        subject_id:
          type: string
          minLength: 1
        scenario_key:
          type: string
          const: nurture
        owner_ref:
          type: string
          pattern: '^nurture_(child|family)_binding_anchor_v1:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        owner_version:
          type: integer
          minimum: 1
        authorized_actor_id:
          type: string
          minLength: 1
        represented_organization_id:
          type: string
          minLength: 1
        purpose:
          type: string
          const: scenario_binding_write
        verified_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    HarnessPrepareRequest:
      type: object
      description: |
        Trusted context comes from the authenticated My-Chat caller; typed
        operation input stays capability-specific. Raw targets, grants and
        internal route fields are never accepted — targets travel only as
        owner-issued opaque option refs.
      additionalProperties: false
      required:
        - workspace_id
        - actor_participant_id
        - surface
        - capability_key
        - capability_version
      properties:
        workspace_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        actor_participant_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        surface:
          type: string
          enum: [chat, board]
        capability_key:
          type: string
          enum:
            - submit_family_care_question
            - initiate_caregiver_direct_message
            - acknowledge_family_care_item
            - reply_family_care_item
            - correct_family_care_message
            - withdraw_family_care_request
            - redact_family_care_message
            - policy_redact_family_care_message
            - update_guardian_current_focus
            - record_caregiver_daily_care
            - cancel_publish_process
            - acquire_publish_edit_hold
            - renew_publish_edit_hold
            - release_publish_edit_hold
            - save_publish_process_draft
            - confirm_child_media_attribution
            - reject_child_media_attribution
            - supersede_child_media_attribution
        capability_version:
          type: string
          const: 1.0.0
        operation_input:
          description: Capability-specific closed typed input; empty for acknowledge.
        target_option_ref:
          $ref: '#/components/schemas/BoundedIdentifier'
        host_conversation_ref:
          $ref: '#/components/schemas/BoundedIdentifier'
    HarnessPrepareResponse:
      type: object
      description: Closed prepare decision union discriminated by status.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready_to_confirm, needs_input, denied, unavailable]
        preview:
          type: object
          description: |
            Safe display projection of the prepared command. Values are scalar;
            some are numeric (for example a focus priority).
          additionalProperties:
            type: [string, number]
        confirmation_ref:
          type: string
        expires_at:
          type: string
          format: date-time
        command_request_id:
          type: string
        fields:
          type: array
          items:
            type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [target_option_ref, display_label]
            properties:
              target_option_ref:
                type: string
              display_label:
                type: string
        reason_code:
          type: string
        alternate_process:
          type: string
    HarnessExecuteRequest:
      type: object
      description: |
        Resubmits the exact typed input together with the confirmation the
        user gesture consumed. The exact target and expected heads are
        recovered from the confirmation, never from the caller.
      additionalProperties: false
      required:
        - workspace_id
        - actor_participant_id
        - surface
        - capability_key
        - capability_version
        - invocation_request_id
        - command_request_id
        - confirmation_ref
      properties:
        workspace_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        actor_participant_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        surface:
          type: string
          enum: [chat, board]
        capability_key:
          type: string
          enum:
            - submit_family_care_question
            - initiate_caregiver_direct_message
            - acknowledge_family_care_item
            - reply_family_care_item
            - correct_family_care_message
            - withdraw_family_care_request
            - redact_family_care_message
            - policy_redact_family_care_message
            - update_guardian_current_focus
            - record_caregiver_daily_care
            - cancel_publish_process
            - acquire_publish_edit_hold
            - renew_publish_edit_hold
            - release_publish_edit_hold
            - save_publish_process_draft
            - confirm_child_media_attribution
            - reject_child_media_attribution
            - supersede_child_media_attribution
        capability_version:
          type: string
          const: 1.0.0
        invocation_request_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        command_request_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        confirmation_ref:
          type: string
          minLength: 32
          maxLength: 256
        operation_input:
          description: Capability-specific closed typed input; empty for acknowledge.
        host_conversation_ref:
          $ref: '#/components/schemas/BoundedIdentifier'
    HarnessExecuteResponse:
      type: object
      description: Closed execute outcome union discriminated by status.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [committed, not_committed, outcome_unknown]
        execution_disposition:
          type: string
          enum: [executed, replayed]
        business_outcome:
          type: string
          enum: [applied, already_satisfied]
        execution_ref:
          type: object
          additionalProperties: true
        output_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        committed_result:
          description: Capability-specific body-free immutable result persisted with the CommandExecution and returned unchanged on exact replay.
        decision:
          type: string
        reason_code:
          type: string
        recovery:
          type: string
          enum: [none, refresh, reprepare, retry_same_command, reconcile_same_command]
    HarnessQueryRequest:
      type: object
      description: |
        Trusted context comes from the authenticated My-Chat caller. The item
        detail query targets only an owner-issued opaque care-item ref; raw
        ids are never accepted.
      additionalProperties: false
      required:
        - workspace_id
        - actor_participant_id
        - surface
        - capability_key
        - capability_version
      properties:
        workspace_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        actor_participant_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        surface:
          type: string
          enum: [chat, board]
        capability_key:
          type: string
          enum:
            - query_guardian_family_care_timeline
            - query_caregiver_family_care_work
            - query_family_care_item
            - query_guardian_family_board
            - query_guardian_current_focus
            - query_guardian_enrollment_activity
            - query_caregiver_teacher_board
            - query_caregiver_child_today
            - query_teacher_publish_queue
        capability_version:
          type: string
          description: |
            The one exact version the named capability is registered at. The
            pairing is enforced per capability by the ingress, not per lane.
          enum: ['1.0.0', '1.1.0']
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        cursor:
          type: string
          maxLength: 2048
        target_option_ref:
          $ref: '#/components/schemas/BoundedIdentifier'
    HarnessReadResultRequest:
      type: object
      description: |
        Regenerates the role-safe projection for a committed action. The
        action is named by its stable business command identity; the service
        reads that execution's own stored output refs, so canonical refs and
        raw ids are never accepted from the caller.
      additionalProperties: false
      required:
        - workspace_id
        - actor_participant_id
        - surface
        - command_request_id
      properties:
        workspace_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        actor_participant_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        surface:
          type: string
          enum: [chat, board]
        command_request_id:
          $ref: '#/components/schemas/BoundedIdentifier'
    HarnessQueryResponse:
      type: object
      description: Closed query decision union discriminated by status.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, refresh_required, denied]
        output:
          description: Capability-specific closed role-safe projection.
        reason_code:
          type: string
    InstitutionBusinessCommunicationReadRequest:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - actor_participant_id
        - surface
        - interface_contract
        - target_option_ref
      properties:
        workspace_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        actor_participant_id:
          $ref: '#/components/schemas/BoundedIdentifier'
        surface:
          type: string
          const: admin
        interface_contract:
          $ref: '#/components/schemas/InstitutionBusinessCommunicationInterfaceContract'
        target_option_ref:
          $ref: '#/components/schemas/BoundedIdentifier'
    InstitutionBusinessCommunicationInterfaceContract:
      type: object
      additionalProperties: false
      required: [key, version, digest]
      properties:
        key:
          type: string
          const: nurture.institution-business-communication-owner-read
        version:
          type: string
          const: 1.0.0
        digest:
          type: string
          const: sha256:dd1b63fe6c7975bafb4170aff3dccc92463dfaf3e5ea7e5bd3c80f1298d6c921
    InstitutionBusinessCommunicationReadResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, denied, unavailable]
        output:
          $ref: '#/components/schemas/InstitutionBusinessCommunicationProjectionV1'
        reason_code:
          type: string
          enum: [not_authorized, protected_content_unavailable]
    InstitutionBusinessCommunicationProjectionV1:
      type: object
      additionalProperties: false
      required:
        - interfaceContract
        - projectionRole
        - messageRef
        - occurredAt
        - businessScope
        - author
        - changeState
        - attachments
        - actions
      properties:
        interfaceContract:
          $ref: '#/components/schemas/InstitutionBusinessCommunicationInterfaceContract'
        projectionRole:
          type: string
          const: institution_admin
        messageRef:
          type: string
          pattern: '^[0-9a-f]{32}$'
        occurredAt:
          type: string
          format: date-time
        businessScope:
          type: object
          additionalProperties: false
          required:
            - enrollmentRef
            - careGroupRef
            - institutionRef
            - dataClass
            - direction
            - purpose
            - adminSupervision
          properties:
            enrollmentRef:
              type: string
              pattern: '^[0-9a-f]{32}$'
            careGroupRef:
              type: string
              pattern: '^[0-9a-f]{32}$'
            institutionRef:
              type: string
              pattern: '^[0-9a-f]{32}$'
            dataClass:
              type: string
              enum: [family_care_question, direct_care_communication]
            direction:
              type: string
              enum: [family_to_org, org_to_family]
            purpose:
              type: string
              const: family_care_workflow
            adminSupervision:
              type: string
              const: pre_send_disclosed
        author:
          type: object
          additionalProperties: false
          required: [side, role]
          properties:
            side:
              type: string
              enum: [family, care_group]
            role:
              type: string
              enum: [guardian, caregiver, lead_caregiver]
        changeState:
          type: object
          additionalProperties: false
          required: [content, lifecycle]
          properties:
            content:
              type: string
              enum: [original, corrected, redacted]
            lifecycle:
              type: string
              enum: [active, closed, suppressed]
            lifecycleReason:
              type: string
              enum: [family_withdrawn, grant_revoked, source_redacted, expired]
        content:
          type: object
          additionalProperties: false
          required: [body]
          properties:
            body:
              type: string
              minLength: 1
              maxLength: 2000
        attachments:
          type: array
          description: G2-B plain-text messages do not support attachments; a future interface rotation is required before exposing any protected attachment carrier.
          maxItems: 0
        actions:
          type: array
          maxItems: 0
    HarnessError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
